<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICEDew Valley - Play</title>
    <link rel="stylesheet" href="./css/play.css" />
    <script src="./js/play.js" type="module"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <aside class="back-link">
      <a href="./index.html">Voltar</a>
    </aside>
    <aside class="sidebar">
      <div class="header-container">
        <h2>ICEDew Valley</h2>
        <p>Canteiro para plantio, clique para interagir.</p>
      </div>

      <div class="money-container">
        <h3>Dinheiro</h3>
        <div id="money-board" class="money-board">
          <p id="money-amount">0</p>
        </div>
      </div>

      <div class="tools-container">
        <h3>Ferramentas</h3>
        <div id="tools-board" class="tools-board"></div>
      </div>

      <div class="seeds-container">
        <h3>Sementes</h3>
        <div id="seeds-board" class="seeds-board"></div>
      </div>
    </aside>

    <div id="game-board" class="game-board"></div>
  </body>
</html>
